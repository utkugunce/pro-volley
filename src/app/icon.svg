<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191326"/>
      <stop offset="55%" stop-color="#0F0B17"/>
      <stop offset="100%" stop-color="#28101C"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="140" y1="150" x2="372" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F5B83D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="110" y1="340" x2="402" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#F5B83D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#ringGrad)" stroke-width="14"/>

  <!-- Subtle Volleyball Court / Ball Seam Arcs -->
  <path d="M96 346 C175 304, 337 304, 416 346" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M126 382 C195 352, 317 352, 386 382" stroke="#BE123C" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

  <!-- Royal Crown Emblem -->
  <path
    d="M128 312 L106 184 L188 242 L256 146 L324 242 L406 184 L384 312 Z"
    fill="url(#crownGrad)"
    stroke="#FEF9C3"
    stroke-opacity="0.45"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <!-- Crown Base Band -->
  <rect x="130" y="324" width="252" height="26" rx="13" fill="url(#crownGrad)"/>

  <!-- Crown Jewels -->
  <circle cx="106" cy="176" r="14" fill="#FDE047"/>
  <circle cx="256" cy="138" r="18" fill="#FEF08A"/>
  <circle cx="406" cy="176" r="14" fill="#FDE047"/>
  <circle cx="256" cy="256" r="12" fill="#BE123C"/>
</svg>
